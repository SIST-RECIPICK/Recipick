server:
  port: 8080
  servlet:
    context-path: /
spring:
  config:
    import: 
      - classpath:db.properties
      - classpath:postgres.properties
  datasource:
    oracle:
      url: ${sist_url}
      username: ${sist_username}
      password: ${sist_password}
      driver-class-name: oracle.jdbc.driver.OracleDriver
    postgres:
      url: ${post_url}
      username: ${post_username}
      password: ${post_password}
      driver-class-name: org.postgresql.Driver
  jpa:
    database: oracle
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect 
        format_sql: true
        user_sql_comments: true   
  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:templates/
    suffix: .html
    mode: HTML
  ai:
    google:
      genai:
        api-key: ${GEN_KEY}
        project-id: gen-lang-client-0074645742
        location: us-central1
        embedding:
          api-key: ${GEN_KEY}
          project-id: gen-lang-client-0074645742
          text: 
            options:
              model: gemini-embedding-001
              dimensions: 768
  model: 
    embedding:
mybatis:
  type-aliases-package: com.sist.web.vo
  mapper-locations: mybatis/mapper/*.xml
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE